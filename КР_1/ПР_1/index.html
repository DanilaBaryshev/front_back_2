<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Карточка товара</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card">
    <!-- фотография товара -->
    <img class="card__image"
         src="fan.jpeg"
         alt="Напольный вентилятор">

    <div class="card__body">
      <!-- название товара -->
      <h2 class="card__body__title">Напольный вентилятор</h2>

      <!-- описание товара -->
      <p class="card__body__description">
        Мощный тихий вентилятор в подарок на день рождение, восьмое марта,
        новый год. Будет прекрасно смотреться в саду и на крыше.
      </p>
    </div>
  </div>

</body>
</html>
